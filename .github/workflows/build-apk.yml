
name: Build CryptoAnalyser-by ErrZhr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Find project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate or extract Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE"
          SEARCH_ROOT="$RUNNER_TEMP/android-project-search"
          mkdir -p "$SEARCH_ROOT"

          # First search the checked-out repository.
          PROJECT_DIR=""

          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"

            if {
              test -f "$candidate/app/build.gradle" ||
              test -f "$candidate/app/build.gradle.kts"
            }; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$REPO" \
              \( -type d \( \
                -name .git -o \
                -name .gradle -o \
                -name build -o \
                -name node_modules \
              \) -prune \) -o \
              \( -type f \( \
                -name settings.gradle -o \
                -name settings.gradle.kts \
              \) -print0
          )

          # If the project is packaged in a ZIP, extract it and search again.
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Project not found directly. Searching ZIP archives..."

            ZIP_COUNT=0

            while IFS= read -r -d '' archive; do
              ZIP_COUNT=$((ZIP_COUNT + 1))
              DEST="$SEARCH_ROOT/archive-$ZIP_COUNT"
              mkdir -p "$DEST"

              echo "Extracting: $archive"

              if ! unzip -oq "$archive" -d "$DEST"; then
                echo "WARNING: Could not extract $archive"
                continue
              fi

              while IFS= read -r -d '' settings_file; do
                candidate="$(dirname "$settings_file")"

                if {
                  test -f "$candidate/app/build.gradle" ||
                  test -f "$candidate/app/build.gradle.kts"
                }; then
                  PROJECT_DIR="$candidate"
                  break
                fi
              done < <(
                find "$DEST" \
                  \( -type d \( \
                    -name .git -o \
                    -name .gradle -o \
                    -name build -o \
                    -name node_modules \
                  \) -prune \) -o \
                  \( -type f \( \
                    -name settings.gradle -o \
                    -name settings.gradle.kts \
                  \) -print0
              )

              if [[ -n "$PROJECT_DIR" ]]; then
                break
              fi
            done < <(
              find "$REPO" -type f -iname '*.zip' -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            echo "Repository file listing:"
            find "$REPO" -maxdepth 5 -type f | head -250
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Android project found at: $PROJECT_DIR"
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate project files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle &&
                ! -f settings.gradle.kts ]]; then
            echo "::error::Missing Gradle settings file."
            exit 1
          fi

          if [[ ! -f app/build.gradle &&
                ! -f app/build.gradle.kts ]]; then
            echo "::error::Missing app module Gradle file."
            exit 1
          fi

          echo "Gradle project structure is valid."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "No Gradle wrapper found; using installed Gradle."
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Run Android lint
        id: lint
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ./gradlew ]]; then
            ./gradlew --no-daemon lintDebug
          else
            gradle --no-daemon lintDebug
          fi

      - name: Find APK files
        id: apk
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk-output"
          FOUND=0

          if [[ -n "${PROJECT_DIR:-}" &&
                -d "${PROJECT_DIR:-/nonexistent}" ]]; then
            while IFS= read -r -d '' apk_file; do
              cp "$apk_file" "$RUNNER_TEMP/apk-output/"
              FOUND=1
              echo "Found APK: $apk_file"
            done < <(
              find "$PROJECT_DIR" -type f -name '*.apk' -print0
            )
          fi

          if [[ "$FOUND" -eq 0 ]]; then
            echo "No APK was generated."
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-by-ErrZhr-APK
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Show lint warning
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Lint reported issues. Review the build logs."
