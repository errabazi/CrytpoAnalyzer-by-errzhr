
name: Build CryptoAnalyser-by ErrZhr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Locate project, build APK, and run lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept SDK licenses
        uses: android-actions/setup-android@v4

      - name: Install/configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project directory safely
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(python3 - <<'PY'
          import os
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          ignored = {
              ".git", ".gradle", ".idea",
              "build", "node_modules"
          }
          candidates = []

          for current, dirs, files in os.walk(repo):
              dirs[:] = [
                  d for d in dirs if d not in ignored
              ]
              current_path = Path(current)

              has_settings = (
                  "settings.gradle" in files or
                  "settings.gradle.kts" in files
              )

              app_dir = current_path / "app"
              has_app_build = (
                  (app_dir / "build.gradle").is_file() or
                  (app_dir / "build.gradle.kts").is_file()
              )

              if has_settings and has_app_build:
                  candidates.append(current_path)

          if not candidates:
              print("ERROR: Android project root not found.")
              print(
                  "Expected settings.gradle(.kts) and "
                  "app/build.gradle(.kts)."
              )
              print("Repository files (first 250):")

              count = 0
              for current, dirs, files in os.walk(repo):
                  dirs[:] = [
                      d for d in dirs if d not in ignored
                  ]
                  for name in files:
                      print(
                          Path(current, name).relative_to(repo)
                      )
                      count += 1
                      if count >= 250:
                          break
                  if count >= 250:
                      break

              raise SystemExit(1)

          candidates.sort(
              key=lambda p: (
                  len(p.relative_to(repo).parts), str(p)
              )
          )

          selected = candidates[0]
          print(selected)
          PY
          )"

          if [[ -z "$PROJECT_DIR" || ! -d "$PROJECT_DIR" ]]; then
            echo "ERROR: Project directory not found: $PROJECT_DIR" >&2
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/settings.gradle" && \
                ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "ERROR: Gradle settings file is missing." >&2
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && \
                ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app Gradle file is missing." >&2
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected Android project root: $PROJECT_DIR"
          echo "Repository root: $GITHUB_WORKSPACE"
          ls -la "$PROJECT_DIR"

      - name: Verify Java, Gradle, and project paths
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

          test -f settings.gradle || \
            test -f settings.gradle.kts

          test -f app/build.gradle || \
            test -f app/build.gradle.kts

          echo "All required project paths exist."

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android lint
        id: lint
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace lintDebug

      - name: Collect generated APK and lint reports
        id: collect
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_DIR:-}" || ! -d "$PROJECT_DIR" ]]; then
            echo "No valid project directory to collect outputs."
            exit 0
          fi

          OUTPUT_FILE="$RUNNER_TEMP/android-artifact-paths.txt"
          : > "$OUTPUT_FILE"

          while IFS= read -r -d '' file; do
            printf '%s\n' "$file" >> "$OUTPUT_FILE"
          done < <(
            find "$PROJECT_DIR" -type f \( \
              -path '*/build/outputs/apk/debug/*.apk' -o \
              -path '*/build/reports/lint-results-debug.html' -o \
              -path '*/build/reports/lint-results-debug.xml' \
            \) -print0
          )

          if [[ -s "$OUTPUT_FILE" ]]; then
            {
              echo 'paths<<EOF'
              cat "$OUTPUT_FILE"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"

            echo "Collected artifacts:"
            cat "$OUTPUT_FILE"
          else
            echo "No APK or lint report was generated."
            {
              echo 'paths<<EOF'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK and lint reports
        if: always() && steps.collect.outputs.paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-by-ErrZhr-android-build
          path: ${{ steps.collect.outputs.paths }}
          if-no-files-found: warn
          retention-days: 14

      - name: Report lint status
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "Android lint reported issues. Review the uploaded report." >&2
          exit 1
