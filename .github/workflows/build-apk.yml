
name: Build CryptoAnalyser-by ErrZhr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Find project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate or extract Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE"
          SEARCH_ROOT="$RUNNER_TEMP/android-project-search"
          mkdir -p "$SEARCH_ROOT"

          PROJECT_DIR=""

          find_project() {
            local root="$1"
            local settings_file
            local candidate

            while IFS= read -r -d '' settings_file; do
              candidate="$(dirname "$settings_file")"

              if [[ -f "$candidate/app/build.gradle" ||
                    -f "$candidate/app/build.gradle.kts" ]]; then
                PROJECT_DIR="$candidate"
                return 0
              fi
            done < <(
              find "$root" \
                -type d \( \
                  -name .git -o \
                  -name .gradle -o \
                  -name build -o \
                  -name node_modules \
                \) -prune -o \
                -type f \( \
                  -name settings.gradle -o \
                  -name settings.gradle.kts \
                \) -print0
            )

            return 1
          }

          if ! find_project "$REPO"; then
            echo "Project not found directly."
            echo "Searching ZIP archives..."

            ZIP_COUNT=0

            while IFS= read -r -d '' archive; do
              ZIP_COUNT=$((ZIP_COUNT + 1))
              DEST="$SEARCH_ROOT/archive-$ZIP_COUNT"
              mkdir -p "$DEST"

              echo "Extracting: $archive"

              if ! unzip -oq "$archive" -d "$DEST"; then
                echo "::warning::Could not extract $archive"
                continue
              fi

              if find_project "$DEST"; then
                break
              fi
            done < <(
              find "$REPO" \
                -type d -name .git -prune -o \
                -type f -iname '*.zip' -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            echo "Repository files:"
            find "$REPO" -maxdepth 4 -type f \
              -not -path '*/.git/*' | head -200
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle &&
                ! -f settings.gradle.kts ]]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [[ ! -f app/build.gradle &&
                ! -f app/build.gradle.kts ]]; then
            echo "::error::App module Gradle file is missing."
            exit 1
          fi

          echo "Android project structure is valid."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.11.1..."
            gradle --version
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find APK files
        if: always()
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/apk-output"
          mkdir -p "$OUTPUT_DIR"

          FOUND=0

          if [[ -n "${PROJECT_DIR:-}" &&
                -d "${PROJECT_DIR:-/nonexistent}" ]]; then
            while IFS= read -r -d '' apk_file; do
              cp "$apk_file" "$OUTPUT_DIR/"
              FOUND=1
              echo "Found APK: $apk_file"
            done < <(
              find "$PROJECT_DIR" -type f -name '*.apk' -print0
            )
          fi

          if [[ "$FOUND" -eq 0 ]]; then
            echo "::warning::No APK was generated."
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-by-ErrZhr-APK
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
